# Juego-Drone — Configuracion de juego
# Todos los campos son opcionales: el valor ausente usa el default de fabrica.
# Rangos: los valores fuera de rango se ignoran y generan un aviso en consola.

[physics]
gravity          = 9.81
drone_mass       = 1.2
max_thrust       = 25.0
drag_coefficient = 0.35
drone_radius     = 0.4
crash_speed      = 8.0

[battery]
max          = 100.0
per_newton   = 0.02
low_threshold = 20.0

[loop]
fixed_timestep       = 0.0166667
