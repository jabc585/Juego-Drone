name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format
        run: pip install clang-format==19.1.7

      - name: Check formatting
        run: clang-format --dry-run -Werror $(git ls-files '*.h' '*.cpp')

      # Se buscan los símbolos completos, no subcadenas: el patrón anterior
      # marcaba cualquier identificador que contuviera "cin" —"bounciness",
      # sin ir más lejos— y tumbaba el job por un falso positivo.
      - name: Check no iostream in core
        run: "! grep -rnE 'std::(cout|cerr|cin)|\\b(printf|fprintf|puts)\\s*\\(' src/core/"

      # ADR-009: rp3d no sale del pimpl de drone_physics. Si estas cabeceras
      # se filtran, el core deja de compilar sin el motor y la fachada se
      # vuelve decorativa.
      - name: Check rp3d stays inside drone_physics (ADR-009)
        run: "! grep -rn 'reactphysics3d' src/core src/frontend src/app"

      - name: Check rp3d is absent from the drone_physics public API (ADR-009)
        run: "! grep -rn 'reactphysics3d' src/physics/*.h"

  build-and-test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build-type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DDRONE_WERROR=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build-type }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build-type }} --output-on-failure

  sanitizers:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure with ASan + UBSan
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  coverage:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install gcovr
        run: pip install gcovr

      - name: Configure with coverage
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="--coverage"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Generate coverage report
        run: |
          gcovr --root . --object-directory build \
                --filter 'src/core/' \
                --xml coverage.xml \
                --print-summary

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
